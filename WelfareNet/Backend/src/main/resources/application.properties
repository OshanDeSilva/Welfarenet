spring.application.name=Backend

server.port=8080
spring.datasource.url=${DB_DATASOURCE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Maximum file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==== EMAIL CONFIGURATION ====
#welfarenet123@gmail.com , wfnt$123 , apppwd = wdyz yuhf kbhn lfky
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust =*
# Ensure a default MAIL FROM so JavaMail won't try to derive a local address
spring.mail.properties.mail.smtp.from=no-reply@yourdomain.com
# Optional: set localhost name used by JavaMail if needed
spring.mail.properties.mail.smtp.localhost=localhost

# Properties
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRETACCESSKEY}

